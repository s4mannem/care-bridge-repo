[project]
name = "carebridge"
version = "0.1.0"
description = "CareBridge gateway: the FastAPI service between the Saturday Planner UI and the agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-cloud-bigquery>=3.25",
]

[project.optional-dependencies]
# Pin the ADK version you verified; see agents/README.md once the agent lane adds it.
agents = ["google-adk==2.11.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carebridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
