# Release one component: test (only when _RUN_TESTS=true), build the runtime image, push it to Artifact
# Registry, render its Cloud Run manifests and create a Cloud Deploy release.
# The release rolls out to the first environment (dev) on its own; later ones
# (prod) are a `gcloud deploy releases promote`, gated by approval.
#
# Substitutions come from the trigger (infra/triggers.tf) or ci/submit.sh.
steps:
  # Tests are off by default to keep PR checks and releases fast. Set
  # _RUN_TESTS=true on the trigger (or RUN_TESTS=true for ci/submit.sh) to
  # build the `test` stage again.
  - id: test
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    entrypoint: bash
    args:
      - -c
      - |
        if [[ "${_RUN_TESTS}" != true ]]; then echo "Tests skipped (_RUN_TESTS=${_RUN_TESTS})"; exit 0; fi
        docker build --target test --progress plain "${_DIR}"

  - id: build-push
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_COMPONENT}"
        sha="${SHORT_SHA}"; bid="${BUILD_ID}"
        tag="$${sha:-build-$${bid:0:8}}"
        docker build --target runtime --progress plain -t "$$image:$$tag" "${_DIR}"
        docker push "$$image:$$tag"
        docker inspect --format='{{index .RepoDigests 0}}' "$$image:$$tag" > /workspace/image.txt
        echo "Pushed $$(cat /workspace/image.txt)"

  - id: render
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args:
      - ci/scripts/render.py
      - --component=${_COMPONENT}
      - --envs=${_ENVS}
      - --prefix=${_PREFIX}
      - --project=${PROJECT_ID}
      - --project-number=${_PROJECT_NUMBER}
      - --region=${_REGION}
      - --out=/workspace/release

  - id: release
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Cloud Deploy names the rollout <release>-to-<target>-0001, which must fit in 63 characters.
        rel="$$(echo "${_COMPONENT}-${BUILD_ID}" | cut -c1-36)"
        gcloud deploy releases create "$$rel" \
          --project="${PROJECT_ID}" --region="${_REGION}" \
          --delivery-pipeline="${_PREFIX}-${_COMPONENT}" \
          --source=/workspace/release \
          --gcs-source-staging-dir="gs://${_DEPLOY_BUCKET}/source" \
          --images="app=$$(cat /workspace/image.txt)"

substitutions:
  _COMPONENT: ""
  _DIR: ""
  _RUN_TESTS: "false"
  _ENVS: "dev,prod"
  _PREFIX: carebridge
  _REGION: us-central1
  _REPO: carebridge
  _PROJECT_NUMBER: ""
  _DEPLOY_BUCKET: ""

options:
  # No machineType: Qwiklabs event projects reject custom Cloud Build machine types.
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
