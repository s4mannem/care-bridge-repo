# Cloud Run service for the team's agents on ADK (`adk web`: dev UI + REST API),
# built from agents/. Rendered per env by ci/scripts/render.py.
# Note: render.py treats every dollar sign here as a variable; write $$ for a literal one.
#
# Private: callers need roles/run.invoker and send an ID token. To open the dev UI:
#   gcloud run services proxy ${SERVICE} --region ${REGION} --port 8090
# The planner UI does not call this; it goes through the API, which runs its own copy.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    app: ${PREFIX}
    component: ${COMPONENT}
    env: ${ENV}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # adk web keeps sessions in memory, so one instance keeps a session reachable.
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      timeoutSeconds: 900
      containers:
        - image: app
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            # Names the team's carebridge/config.py reads.
            - name: GOOGLE_CLOUD_PROJECT
              value: ${PROJECT_ID}
            # Gemini 3.x is served from the global endpoint.
            - name: GOOGLE_CLOUD_LOCATION
              value: global
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GEMINI_MODEL_FAST
              value: gemini-3.6-flash
            - name: GEMINI_MODEL_REASONING
              value: gemini-3.6-flash
            - name: MCP_BIGQUERY_URL
              value: https://bigquery.googleapis.com/mcp
            - name: BIGQUERY_DATASET
              value: a4i_health
            - name: GEMINI_MIN_GAP_S
              value: "3"
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 12   # up to 2 minutes to start
