# Cloud Run service for the ADK agents. Disabled in deploy/components.yaml until
# agents/ has a Dockerfile with `test` and `runtime` stages listening on the
# PORT env var (for example `adk api_server --host 0.0.0.0 --port 8080`).
# Note: render.py treats every dollar sign here as a variable; write $$ for a literal one.
#
# Private: callers (the API) need roles/run.invoker and send an ID token.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    app: ${PREFIX}
    component: ${COMPONENT}
    env: ${ENV}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      timeoutSeconds: 300
      containers:
        - image: app
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GOOGLE_CLOUD_PROJECT
              value: ${PROJECT_ID}
            - name: GOOGLE_CLOUD_LOCATION
              value: ${REGION}
            - name: BQ_PROJECT
              value: ${PROJECT_ID}
            - name: BQ_DATASET
              value: a4i_health
