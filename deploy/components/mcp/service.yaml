# Cloud Run service for a self-hosted MCP Toolbox for Databases. Disabled in
# deploy/components.yaml until mcp/ exists, e.g. a Dockerfile that starts
# FROM the Toolbox image, COPYs tools.yaml, and runs
# `toolbox --tools-file tools.yaml --address 0.0.0.0 --port 8080`.
#
# Private: agents call it with an ID token and need roles/run.invoker.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    app: ${PREFIX}
    component: ${COMPONENT}
    env: ${ENV}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      containers:
        - image: app
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: BQ_PROJECT
              value: ${PROJECT_ID}
